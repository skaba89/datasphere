name: CI - Build & Test

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  # ── Vérification du schéma Prisma ─────────────────────────────────────────────
  prisma:
    name: Prisma Validate & Generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

  # ── Build & Test API NestJS ──────────────────────────────────────────────────
  api:
    name: API Build & Test
    runs-on: ubuntu-latest
    needs: prisma
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

      - name: Build API
        run: cd apps/api && npx nest build

      - name: Run API Tests
        run: cd apps/api && npx jest --config jest.config.json --verbose --forceExit
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
          JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-key-minimum-32-characters-long

  # ── Build Frontend Next.js ───────────────────────────────────────────────────
  web:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: prisma
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Build Frontend
        run: cd apps/web && npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: prisma
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Lint API
        run: cd apps/api && npm run lint --if-present
        continue-on-error: true
