# Override automatiquement chargé en développement local
# Expose les ports de l'infrastructure pour accès direct depuis le host
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  clickhouse:
    ports:
      - "8123:8123"
