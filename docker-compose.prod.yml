version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-guineatender}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-guineatender_db}
    volumes:
      - postgres_prod:/var/lib/postgresql/data
    networks:
      - gt_network

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_prod:/data
    networks:
      - gt_network

  minio:
    image: minio/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_prod:/data
    command: server /data --console-address ":9001"
    networks:
      - gt_network

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    volumes:
      - qdrant_prod:/qdrant/storage
    networks:
      - gt_network

  api:
    image: guineatender-api:latest
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
    env_file:
      - .env.prod
    networks:
      - gt_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.guineatender.ai`)"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"

  web:
    image: guineatender-web:latest
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: https://api.guineatender.ai/api/v1
      NODE_ENV: production
    networks:
      - gt_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`guineatender.ai`)"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"

  traefik:
    image: traefik:v3
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@guineatender.ai"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - gt_network

volumes:
  postgres_prod:
  redis_prod:
  minio_prod:
  qdrant_prod:
  letsencrypt:

networks:
  gt_network:
    external: false
