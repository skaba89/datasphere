services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guineatender
      POSTGRES_PASSWORD: password
      POSTGRES_DB: guineatender_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guineatender"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gt_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (stockage S3-compatible) ───────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: gt_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── Qdrant (base vectorielle) ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gt_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── ClickHouse (analytics) ───────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: gt_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: guineatender_analytics
      CLICKHOUSE_USER: guineatender
      CLICKHOUSE_PASSWORD: password

  # ── Backend API (NestJS) ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gt_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://guineatender:password@postgres:5432/guineatender_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - "4000:4000"
    env_file:
      - .env

  # ── Frontend Web (Next.js) ───────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* sont baked au build — doit pointer vers localhost pour le navigateur
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    container_name: gt_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  clickhouse_data:

networks:
  default:
    name: guineatender_network
