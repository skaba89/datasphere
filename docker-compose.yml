services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guineatender
      POSTGRES_PASSWORD: password
      POSTGRES_DB: guineatender_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guineatender -d guineatender_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gt_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (stockage S3-compatible) ───────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: gt_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ── Qdrant (base vectorielle) ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gt_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── ClickHouse (analytics) ───────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: gt_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: guineatender_analytics
      CLICKHOUSE_USER: guineatender
      CLICKHOUSE_PASSWORD: password

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  clickhouse_data:

networks:
  default:
    name: guineatender_network
